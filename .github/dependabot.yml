version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - next
          - eslint-config-next
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
          - prettier-plugin-tailwindcss
      supabase:
        patterns:
          - "@supabase/*"
      drizzle:
        patterns:
          - drizzle-orm
          - drizzle-kit
          - postgres
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
